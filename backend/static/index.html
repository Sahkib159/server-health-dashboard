<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Server Health Dashboard</title>
<style>
  :root {
    --bg: #101418; --panel: #171c22; --line: #262d36;
    --text: #e6e9ec; --muted: #8a94a0;
    --ok: #5fd0a5; --warn: #f0b429; --crit: #ff6b57;
    --cpu: #6cb8ff; --ram: #c39bff; --disk: #f0b429;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3f5f7; --panel: #ffffff; --line: #dfe4ea;
      --text: #1b2128; --muted: #5d6874;
      --ok: #148a63; --warn: #a96f00; --crit: #c8321e;
      --cpu: #1d6fc4; --ram: #7a47c9; --disk: #a96f00;
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .layout { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
  aside { border-right: 1px solid var(--line); padding: 20px 14px; }
  aside h1 { font-size: 16px; margin: 0 8px 16px; font-weight: 650; }
  .server {
    display: block; width: 100%; text-align: left; background: none; color: inherit;
    border: 1px solid transparent; border-radius: 8px; padding: 10px; margin-bottom: 4px; cursor: pointer;
    font: inherit;
  }
  .server:hover { background: var(--panel); }
  .server[aria-current="true"] { background: var(--panel); border-color: var(--line); }
  .server:focus-visible, select:focus-visible { outline: 2px solid var(--cpu); outline-offset: 2px; }
  .server .row { display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--ok); }
  .dot.warn { background: var(--crit); }
  .server small { color: var(--muted); display: block; margin-left: 17px; }
  main { padding: 24px 28px; min-width: 0; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .head h2 { margin: 0; font-size: 26px; font-weight: 650; }
  .head p { margin: 2px 0 0; color: var(--muted); }
  select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font: inherit; }
  .banner { background: color-mix(in srgb, var(--crit) 16%, var(--panel)); border: 1px solid var(--crit); border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; }
  .gauges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 16px; }
  .gauge { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .gauge .label { color: var(--muted); }
  .gauge .value { font-size: 34px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 8px; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 3px; transition: width .4s; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .panel h3 { margin: 0 0 10px; font-size: 15px; font-weight: 650; }
  .chart-wrap { position: relative; height: 300px; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  tr:first-child td { border-top: 0; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 13px; border: 1px solid var(--line); }
  .tag.open { color: var(--crit); border-color: var(--crit); }
  .tag.done { color: var(--ok); border-color: var(--ok); }
  .empty { color: var(--muted); padding: 40px 0; }
  code { background: var(--panel); border: 1px solid var(--line); padding: 2px 6px; border-radius: 6px; }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
    .gauges { grid-template-columns: 1fr; }
    main { padding: 18px 14px; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside>
    <h1>Servers</h1>
    <div id="server-list" role="list"></div>
  </aside>
  <main>
    <div id="empty" class="empty" hidden>
      <h2>No servers reporting yet</h2>
      <p>Start the agent on a machine: <code>python agent/collector.py --name my-pc</code></p>
    </div>
    <div id="content" hidden>
      <div class="head">
        <div>
          <h2 id="name"></h2>
          <p id="meta"></p>
        </div>
        <label>Time range
          <select id="range">
            <option value="15">Last 15 minutes</option>
            <option value="60" selected>Last hour</option>
            <option value="360">Last 6 hours</option>
            <option value="1440">Last 24 hours</option>
          </select>
        </label>
      </div>
      <div id="banner" class="banner" hidden></div>
      <div class="gauges">
        <div class="gauge"><div class="label">CPU</div><div class="value" id="v-cpu">–</div><div class="bar"><i id="b-cpu" style="background:var(--cpu)"></i></div></div>
        <div class="gauge"><div class="label">Memory</div><div class="value" id="v-ram">–</div><div class="bar"><i id="b-ram" style="background:var(--ram)"></i></div></div>
        <div class="gauge"><div class="label">Disk</div><div class="value" id="v-disk">–</div><div class="bar"><i id="b-disk" style="background:var(--disk)"></i></div></div>
      </div>
      <section class="panel">
        <h3>Usage history</h3>
        <div class="chart-wrap"><canvas id="chart"></canvas></div>
      </section>
      <section class="panel">
        <h3>Alerts</h3>
        <table><tbody id="alerts"></tbody></table>
        <p id="no-alerts" class="empty" hidden style="padding:8px 0">No alerts for this server.</p>
      </section>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const REFRESH_MS = 5000;
const state = { server: null, minutes: 60, chart: null };
const $ = (id) => document.getElementById(id);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

async function api(path) {
  const res = await fetch(path);
  if (!res.ok) throw new Error(path + " -> " + res.status);
  return res.json();
}

function fmtUptime(sec) {
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
}
function ago(ts) {
  const s = Math.max(0, Math.round(Date.now() / 1000 - ts));
  return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s / 60)}m ago` : `${Math.round(s / 3600)}h ago`;
}

function renderServers(list) {
  const box = $("server-list");
  box.replaceChildren();
  for (const s of list) {
    const btn = document.createElement("button");
    btn.className = "server";
    btn.setAttribute("role", "listitem");
    btn.setAttribute("aria-current", String(s.server === state.server));
    const row = document.createElement("div");
    row.className = "row";
    const dot = document.createElement("span");
    dot.className = "dot " + (s.open_alerts ? "warn" : s.online ? "on" : "");
    const name = document.createElement("span");
    name.textContent = s.server;
    row.append(dot, name);
    const small = document.createElement("small");
    small.textContent = !s.online ? `Offline · seen ${ago(s.last_seen)}`
      : s.open_alerts ? `${s.open_alerts} open alert${s.open_alerts > 1 ? "s" : ""}` : "Healthy";
    btn.append(row, small);
    btn.onclick = () => { state.server = s.server; refresh(); };
    box.append(btn);
  }
}

function setGauge(key, value) {
  $("v-" + key).textContent = value == null ? "–" : value.toFixed(0) + "%";
  const bar = $("b-" + key);
  bar.style.width = (value || 0) + "%";
}

function renderChart(points) {
  const labels = points.map(p => new Date(p.ts * 1000).toLocaleTimeString([], state.minutes <= 60
     ? { hour: "2-digit", minute: "2-digit", second: "2-digit" }
     : { hour: "2-digit", minute: "2-digit" }));
  const series = [["CPU", "cpu", "--cpu"], ["Memory", "ram", "--ram"], ["Disk", "disk", "--disk"]];
  const datasets = series.map(([label, key, color]) => ({
    label, data: points.map(p => p[key]), borderColor: css(color), borderWidth: 2, pointRadius: 0, tension: 0.25,
  }));
  if (!state.chart) {
    state.chart = new Chart($("chart"), {
      type: "line",
      data: { labels, datasets },
      options: {
        animation: false, responsive: true, maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        scales: {
          y: { min: 0, max: 100, ticks: { callback: v => v + "%", color: css("--muted") }, grid: { color: css("--line") } },
          x: { ticks: { maxTicksLimit: 8, color: css("--muted") }, grid: { display: false } },
        },
        plugins: { legend: { labels: { color: css("--text") } } },
      },
    });
  } else {
    state.chart.data.labels = labels;
    state.chart.data.datasets.forEach((d, i) => { d.data = datasets[i].data; });
    state.chart.update();
  }
}

function renderAlerts(list) {
  const body = $("alerts");
  body.replaceChildren();
  $("no-alerts").hidden = list.length > 0;
  for (const a of list) {
    const tr = document.createElement("tr");
    const status = document.createElement("td");
    const tag = document.createElement("span");
    tag.className = "tag " + (a.resolved ? "done" : "open");
    tag.textContent = a.resolved ? "Resolved" : "Open";
    status.append(tag);
    const msg = document.createElement("td");
    msg.textContent = a.message;
    const when = document.createElement("td");
    when.style.color = css("--muted");
    when.textContent = new Date(a.opened * 1000).toLocaleString();
    tr.append(status, msg, when);
    body.append(tr);
  }
}

async function refresh() {
  try {
    const servers = await api("/api/servers");
    $("empty").hidden = servers.length > 0;
    $("content").hidden = servers.length === 0;
    if (!servers.length) { renderServers(servers); return; }
    if (!servers.some(s => s.server === state.server)) state.server = servers[0].server;
    renderServers(servers);
    const cur = servers.find(s => s.server === state.server);

    $("name").textContent = cur.server;
    $("meta").textContent = `${cur.online ? "Online" : "Offline"} · up ${fmtUptime(cur.uptime)} · last report ${ago(cur.last_seen)}`;
    setGauge("cpu", cur.cpu); setGauge("ram", cur.ram); setGauge("disk", cur.disk);

    const q = encodeURIComponent(state.server);
    const [points, alerts] = await Promise.all([
      api(`/api/metrics?server=${q}&minutes=${state.minutes}`),
      api(`/api/alerts?server=${q}&limit=15`),
    ]);
    renderChart(points);
    renderAlerts(alerts);

    const open = alerts.filter(a => !a.resolved);
    const banner = $("banner");
    banner.hidden = open.length === 0;
    banner.textContent = open.map(a => a.message).join(" · ");
  } catch (err) {
    console.error(err);
  }
}

$("range").addEventListener("change", (e) => { state.minutes = Number(e.target.value); refresh(); });
refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
